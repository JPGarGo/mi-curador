<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Curador</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --txt:#e8e8ea; --sub:#9aa0aa; --acc:#f5b942; --ok:#3ecf8e; --mid:#5aa9ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wrap { max-width:900px; margin:0 auto; padding:24px 16px; }
  header h1 { margin:0; font-size:28px; }
  header p { color:var(--sub); margin:4px 0 0; }
  .filtros { display:flex; flex-wrap:wrap; gap:8px; margin:20px 0; }
  .filtros button { background:var(--card); color:var(--txt); border:1px solid #2a2f3a; border-radius:999px; padding:6px 14px; cursor:pointer; }
  .filtros button.activo { background:var(--acc); color:#111; border-color:var(--acc); }
  h2 { font-size:20px; margin:32px 0 12px; color:var(--acc); }
  .card { display:flex; gap:16px; background:var(--card); border-radius:12px; padding:16px; margin-bottom:14px; }
  .card img { width:200px; height:112px; object-fit:cover; border-radius:8px; flex-shrink:0; }
  .meta { color:var(--sub); font-size:14px; }
  .card h3 { margin:6px 0 8px; font-size:18px; line-height:1.3; }
  .card h3 a { color:var(--txt); text-decoration:none; }
  .card h3 a:hover { text-decoration:underline; }
  .nota { display:inline-block; font-weight:700; border-radius:6px; padding:2px 8px; margin-right:8px; }
  .n-alta { background:var(--ok); color:#06210f; }
  .n-media { background:var(--mid); color:#04182e; }
  .n-baja { background:#2a2f3a; color:var(--sub); }
  ul { margin:8px 0; padding-left:20px; }
  .rigor { font-size:14px; color:var(--sub); }
  .hobby { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
  .hobby a { color:var(--txt); text-decoration:none; font-size:14px; }
  .hobby img { width:100%; border-radius:8px; }
  @media (max-width:600px) { .card { flex-direction:column; } .card img { width:100%; height:auto; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎬 Mi Curador</h1>
    <p>Actualizado el 27/10/2026 15:26 · 0 videos analizados</p>
  </header>

  <div class="filtros">
    <button class="activo" data-tema="todos">Todos</button>
    
  </div>

  

  
  <h2>🎸 Hobbies</h2>
  <div class="hobby">
    
    <a href="https://www.youtube.com/watch?v=zdKaYzm6CM0" target="_blank" rel="noopener">
      <img src="https://i.ytimg.com/vi/zdKaYzm6CM0/mqdefault.jpg" alt="" loading="lazy">
      Global Triathlon Network: Can We Beat The Slowest Pro In The Kona Swim?
    </a>
    
    <a href="https://www.youtube.com/watch?v=oiUYRy63ww8" target="_blank" rel="noopener">
      <img src="https://i.ytimg.com/vi/oiUYRy63ww8/mqdefault.jpg" alt="" loading="lazy">
      MrShortGame Golf: EVERYTHING You Ever Wanted to Know about How to Spin Your Wedge Shots in One Video!
    </a>
    
  </div>
  
</div>

<script>
  // Filtro por tema: oculta las tarjetas que no coinciden
  document.querySelectorAll('.filtros button').forEach(boton => boton.onclick = () => {
    document.querySelectorAll('.filtros button').forEach(b => b.classList.remove('activo'));
    boton.classList.add('activo');
    const tema = boton.dataset.tema;
    document.querySelectorAll('.card').forEach(c =>
      c.style.display = (tema === 'todos' || c.dataset.tema === tema) ? '' : 'none');
  });
</script>
</body>
</html>
